<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#18181b"/>
  <rect x="0.5" y="0.5" width="1199" height="674" rx="0" stroke="#27272a" stroke-opacity="0.6"/>
  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#3f3f46" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- Center icon group -->
  <g transform="translate(560, 280)" opacity="0.25">
    <!-- Folder/project icon -->
    <rect x="0" y="12" width="80" height="56" rx="4" stroke="#71717a" stroke-width="2" fill="none"/>
    <path d="M0 16C0 13.79 1.79 12 4 12H28L36 4H76C78.21 4 80 5.79 80 8V12" stroke="#71717a" stroke-width="2" fill="none"/>
    <!-- Small decorative lines inside -->
    <line x1="16" y1="36" x2="64" y2="36" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="48" x2="48" y2="48" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Subtle vignette edges -->
  <rect width="1200" height="675" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
</svg>
