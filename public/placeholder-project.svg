<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#111116"/>
  <!-- Subtle grid -->
  <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
    <circle cx="24" cy="24" r="0.8" fill="#3f3f46" opacity="0.35"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <!-- Code lines - left cluster -->
  <g opacity="0.12" transform="translate(180, 200)">
    <rect x="0" y="0" width="120" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="16" width="80" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="32" width="140" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="48" width="60" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="0" y="64" width="40" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="0" y="96" width="100" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="112" width="160" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="128" width="90" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="0" y="144" width="40" height="3" rx="1.5" fill="#a1a1aa"/>
  </g>
  <!-- Code lines - right cluster -->
  <g opacity="0.08" transform="translate(820, 240)">
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="16" width="100" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="32" width="130" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="48" y="48" width="70" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="24" y="64" width="110" height="3" rx="1.5" fill="#a1a1aa"/>
    <rect x="0" y="80" width="50" height="3" rx="1.5" fill="#a1a1aa"/>
  </g>
  <!-- Center: angle brackets < / > -->
  <g transform="translate(600, 337)" opacity="0.2">
    <!-- < -->
    <path d="M-52 0 L-80 -24 L-52 -48" stroke="#71717a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- / -->
    <line x1="-16" y1="-52" x2="16" y2="4" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
    <!-- > -->
    <path d="M52 0 L80 -24 L52 -48" stroke="#71717a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Terminal cursor blink hint -->
  <rect x="576" y="380" width="48" height="3" rx="1.5" fill="#71717a" opacity="0.15"/>
  <!-- Vignette -->
  <rect width="1200" height="675" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
</svg>
